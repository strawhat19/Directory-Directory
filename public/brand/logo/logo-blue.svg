<svg id="directory-v15-indexed-d-blue" class="directory-indexed-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="directory-title directory-description">
  <title id="directory-title">Directory Directory — Compact rows · blue</title>
  <desc id="directory-description">The original blue folder D surrounds shorter green, blue and red folder pills. The ten-unit bodies have seamless tabs and five-unit end caps. The rows sit closer together with more space at the right of the D.</desc>
