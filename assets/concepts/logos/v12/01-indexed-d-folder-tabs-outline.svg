<svg id="directory-v12-folder-tabs-outline" class="directory-logo directory-logo-outline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="outline-title outline-description">
  <title id="outline-title">Directory Directory — top-left folder tabs, outline</title>
  <desc id="outline-description">The original V9 D in muted steel blue surrounds three rounded pill outlines. Every pill has a small rounded folder tab rising from its upper-left edge. Rows remain green, blue, and red.</desc>
