<svg id="directory-v12-folder-tabs-filled" class="directory-logo directory-logo-filled" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="filled-title filled-description">
  <title id="filled-title">Directory Directory — top-left folder tabs, filled</title>
  <desc id="filled-description">The original V9 D silhouette is filled in muted steel blue. Three colored rounded pills have small rounded folder tabs on their upper-left edges, separated from the D by transparent clearance.</desc>
