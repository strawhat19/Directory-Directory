      <path id="filled-green-clearance" class="directory-row-clearance" fill="#000000" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" d="M44 59V55Q44 52 47 52H54Q56 52 57.5 54.5L59.5 58Q60.1 59 61.5 59H94a5 5 0 0 1 0 10H44a5 5 0 0 1 0-10Z" />
      <path id="filled-blue-clearance" class="directory-row-clearance" fill="#000000" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" d="M44 82V78Q44 75 47 75H54Q56 75 57.5 77.5L59.5 81Q60.1 82 61.5 82H103a5 5 0 0 1 0 10H44a5 5 0 0 1 0-10Z" />
      <path id="filled-red-clearance" class="directory-row-clearance" fill="#000000" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" d="M44 105V101Q44 98 47 98H54Q56 98 57.5 100.5L59.5 104Q60.1 105 61.5 105H84a5 5 0 0 1 0 10H44a5 5 0 0 1 0-10Z" />
