  <path id="filled-blue-folder-pill" class="directory-folder-pill directory-blue-folder-pill" fill="#6684B6" d="M44 82V78Q44 75 47 75H54Q56 75 57.5 77.5L59.5 81Q60.1 82 61.5 82H103a5 5 0 0 1 0 10H44a5 5 0 0 1 0-10Z" />
