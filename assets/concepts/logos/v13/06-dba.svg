  <title id="dba-title">Directory Directory — DBA</title>
  <desc id="dba-description">A blue folder-tab D, green double-bowl B, and red A form a custom geometric DBA monogram. The A has a softened apex and a level record-like crossbar; a seamless red folder record sits inside the D. All shapes are vectors on a transparent canvas.</desc>
