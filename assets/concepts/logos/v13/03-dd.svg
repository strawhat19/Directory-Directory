  <title id="dd-title">Directory Directory — DD</title>
  <desc id="dd-description">Two custom rounded D letterforms with folder-tab shoulders. The blue and green outlines each contain one seamless folder record; the second record is red. All shapes are vectors on a transparent canvas.</desc>
