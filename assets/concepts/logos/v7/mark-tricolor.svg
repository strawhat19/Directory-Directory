    <path id="v7-middle-green-d" stroke="#21A668" vector-effect="non-scaling-stroke" transform="translate(24.524 23.968) scale(.556)" d="M25 20h24c4 0 7 2 9 6l4 8h15c28 0 47 20 47 45s-19 45-47 45H25c-4 0-7-3-7-7V27c0-4 3-7 7-7Z"/>
    <path id="v7-inner-red-d" stroke="#D83B42" vector-effect="non-scaling-stroke" transform="translate(43.268 42.976) scale(.292)" d="M25 20h24c4 0 7 2 9 6l4 8h15c28 0 47 20 47 45s-19 45-47 45H25c-4 0-7-3-7-7V27c0-4 3-7 7-7Z"/>
