<svg id="directory-v14-indexed-d" class="directory-indexed-d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="directory-title directory-description">
  <title id="directory-title">Directory Directory — thinner filled rows</title>
  <desc id="directory-description">The original blue folder D surrounds three thinner green, blue and red folder rows. Each row has a ten-unit pill body, circular five-unit end caps and a six-unit tab that rises seamlessly from the rounded left boundary.</desc>
